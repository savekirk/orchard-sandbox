name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build dashboard
        run: cd web && npm ci && npm run build
      - name: Dashboard build is committed
        run: git diff --exit-code --stat -- internal/web/dist || (echo "Run 'just build-web' and commit internal/web/dist" && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
